name: MVP checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docupilot
          POSTGRES_PASSWORD: docupilot
          POSTGRES_DB: docupilot
        ports: ['56432:5432']
        options: >-
          --health-cmd "pg_isready -U docupilot -d docupilot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MOCK_LLM: '1'
      DATABASE_URL: postgresql://docupilot:docupilot@localhost:56432/docupilot
      TEST_DATABASE_URL: postgresql://docupilot:docupilot@localhost:56432/docupilot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m eval.run --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: reports/
